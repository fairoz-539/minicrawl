<rect width="900" height="410" rx="10" fill="#0d1117"/>
<rect width="900" height="34" rx="10" fill="#161b22"/><rect y="24" width="900" height="10" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
<text x="450" y="22" text-anchor="middle" style="fill:#8b949e;font-size:12px;clip-path:none;animation:none">minicrawl</text>
<text x="22" y="52" class="l0 cmd" xml:space="preserve"><tspan class="prompt">$ </tspan>bash scripts/setup.sh</text>
<text x="22" y="73" class="l1 out muted" xml:space="preserve">Created .env with a new API key. Use it as:  Authorization: Bearer &lt;key&gt;</text>
<text x="22" y="94" class="l2 cmd" xml:space="preserve"><tspan class="prompt">$ </tspan>docker compose up -d</text>
<text x="22" y="115" class="l3 out ok" xml:space="preserve"> ✔ Container minicrawl-searxng-1    Started</text>
<text x="22" y="136" class="l4 out ok" xml:space="preserve"> ✔ Container minicrawl-minicrawl-1  Started</text>
<text x="22" y="169.6" class="l5 cmd" xml:space="preserve"><tspan class="prompt">$ </tspan>curl -s localhost:3002/v1/scrape -H "Authorization: Bearer $KEY" \</text>
<text x="22" y="190.6" class="l6 cmd" xml:space="preserve">    -H 'Content-Type: application/json' -d '{"url": "https://quotes.toscrape.com/js/"}' \</text>
<text x="22" y="211.6" class="l7 cmd" xml:space="preserve">    | jq -r '.data.metadata.engine, .data.markdown'</text>
<text x="22" y="232.6" class="l8 out accent" xml:space="preserve">browser</text>
<text x="22" y="253.6" class="l9 out heading" xml:space="preserve"># [Quotes to Scrape](https://quotes.toscrape.com/)</text>
<text x="22" y="274.6" class="l10 out" xml:space="preserve">“The world as we have created it is a process of our thinking. It cannot…</text>
<text x="22" y="295.6" class="l11 out muted" xml:space="preserve">Tags: change deep-thoughts thinking world</text>
<text x="22" y="316.6" class="l12 out" xml:space="preserve">“It is our choices, Harry, that show what we truly are, far more than our…</text>
<text x="22" y="337.6" class="l13 out muted" xml:space="preserve">Tags: abilities choices</text>
<text x="22" y="371.2" class="l14 out muted" xml:space="preserve"># Next: open http://localhost:3002/docs to try every endpoint in your browser</text>
