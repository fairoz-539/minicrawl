<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-label="minicrawl demo: setup, docker compose up, then scraping a JavaScript-rendered page to markdown">
<title>minicrawl demo</title>
<style>
