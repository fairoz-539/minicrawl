{{- if not .Values.existingSecret }}
{{- if not .Values.databaseUrl }}{{ fail "Set databaseUrl (postgres://...) or existingSecret" }}{{ end }}
{{- if not .Values.apiKeys }}{{ fail "Set apiKeys (openssl rand -hex 32) or existingSecret" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "minicrawl.fullname" . }}
  labels:
    {{- include "minicrawl.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.databaseUrl | quote }}
  API_KEYS: {{ .Values.apiKeys | quote }}
  {{- if .Values.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.anthropicApiKey | quote }}
  {{- end }}
{{- end }}
