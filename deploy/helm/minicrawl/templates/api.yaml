apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "minicrawl.fullname" . }}-api
  labels:
    {{- include "minicrawl.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "minicrawl.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "minicrawl.selector" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- include "minicrawl.podCommon" . | nindent 6 }}
      containers:
        - name: api
          {{- include "minicrawl.containerCommon" . | nindent 10 }}
          env:
            - { name: MODE, value: api }
            {{- include "minicrawl.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "minicrawl.fullname" . }}
  labels:
    {{- include "minicrawl.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "minicrawl.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
