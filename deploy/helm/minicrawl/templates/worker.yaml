apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "minicrawl.fullname" . }}-worker
  labels:
    {{- include "minicrawl.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "minicrawl.selector" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "minicrawl.selector" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      # Let in-flight jobs finish; anything unfinished is retried by another worker.
      terminationGracePeriodSeconds: 90
      {{- include "minicrawl.podCommon" . | nindent 6 }}
      containers:
        - name: worker
          {{- include "minicrawl.containerCommon" . | nindent 10 }}
          env:
            - { name: MODE, value: worker }
            - { name: WORKERS, value: {{ .Values.worker.concurrency | quote }} }
            {{- include "minicrawl.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
{{- if .Values.worker.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "minicrawl.fullname" . }}-worker
  labels:
    {{- include "minicrawl.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "minicrawl.fullname" . }}-worker
  minReplicas: {{ .Values.worker.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.worker.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.worker.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
