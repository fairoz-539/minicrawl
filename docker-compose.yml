# minicrawl + a private SearXNG for /v1/search.
#
#   bash scripts/setup.sh                        # creates .env with your own API key
#   docker compose pull && docker compose up -d  # prebuilt image (amd64/arm64)
#   docker compose up -d --build                 # ...or build from this source
#
# Local AI (no API key, nothing leaves your machine): set LLM_BASE_URL and
# LLM_MODEL in .env (see .env.example), then
#   docker compose --profile local-ai up -d
#   docker compose exec ollama ollama pull qwen3:8b
#
# API: http://localhost:3002   Docs: http://localhost:3002/docs
name: minicrawl

services:
  minicrawl:
    image: ghcr.io/fairoz-539/minicrawl:${MINICRAWL_VERSION:-latest}
    build: .
    ports:
      # MINICRAWL_BIND=127.0.0.1 keeps it reachable from this machine only.
      - "${MINICRAWL_BIND:-0.0.0.0}:${MINICRAWL_PORT:-3002}:3002"
    env_file:
      - path: .env
        required: false
    environment:
      # Always use the bundled SearXNG, whatever .env says for local runs.
      SEARXNG_ENDPOINT: http://searxng:8080
      DB_PATH: /data/minicrawl.db
    volumes:
      - minicrawl-data:/data
    shm_size: 1gb # Chromium needs more shared memory than Docker's 64 MB default
    init: true
    depends_on:
      - searxng
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    # No published port: only minicrawl can reach it, on the internal network.
    volumes:
      - ./deploy/searxng:/etc/searxng
      - searxng-cache:/var/cache/searxng
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-minicrawl-internal-change-me}
      SEARXNG_BASE_URL: http://searxng:8080/
    restart: unless-stopped

  # Optional local model server for AI extraction (json/summary formats, /v1/extract).
  # Only started with --profile local-ai. No published port: only minicrawl reaches it.
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # Ollama's default context (4k tokens) is too small for most pages.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    restart: unless-stopped
    # With an NVIDIA GPU and the NVIDIA Container Toolkit, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

volumes:
  minicrawl-data:
  searxng-cache:
  ollama-models:
