# Scale mode: Postgres + separate API and worker containers.
#
#   bash scripts/setup.sh                                   # creates .env (incl. POSTGRES_PASSWORD)
#   docker compose -f docker-compose.scale.yml pull
#   docker compose -f docker-compose.scale.yml up -d --scale worker=3
#
# Add workers any time with --scale worker=N. The API stays a single container
# here because it publishes the port; to run several, put a load balancer in
# front of them (or use the Helm chart in deploy/helm).
name: minicrawl-scale

x-image: &image
  image: ghcr.io/fairoz-539/minicrawl:${MINICRAWL_VERSION:-latest}
  build: .
  env_file:
    - path: .env
      required: false
  shm_size: 1gb # Chromium
  init: true
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    searxng:
      condition: service_started

x-env: &env
  STORAGE: postgres
  DATABASE_URL: postgres://minicrawl:${POSTGRES_PASSWORD:-change-me-in-env}@postgres:5432/minicrawl
  SEARXNG_ENDPOINT: http://searxng:8080

services:
  api:
    <<: *image
    environment:
      <<: *env
      MODE: api
    ports:
      - "${MINICRAWL_BIND:-0.0.0.0}:${MINICRAWL_PORT:-3002}:3002"

  worker:
    <<: *image
    environment:
      <<: *env
      MODE: worker
      WORKERS: ${WORKERS:-4}

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: minicrawl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-env}
      POSTGRES_DB: minicrawl
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minicrawl -d minicrawl"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./deploy/searxng:/etc/searxng
      - searxng-cache:/var/cache/searxng
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-minicrawl-internal-change-me}
      SEARXNG_BASE_URL: http://searxng:8080/
    restart: unless-stopped

volumes:
  postgres-data:
  searxng-cache:
