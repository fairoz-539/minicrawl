name: Release

# Push a tag to release:
#   v1.2.3      -> GitHub Release with that version's CHANGELOG notes
#                  (the Docker image is published by docker-publish.yml)
#   mcp-v1.2.3  -> npm: minicrawl-mcp   (integrations/mcp)
#   py-v1.2.3   -> PyPI: minicrawl-py   (integrations/python)
# npm and PyPI use trusted publishing (OIDC): no tokens are stored anywhere.
# The tag must match the version in the package's manifest.
on:
  push:
    tags: ["v*", "mcp-v*", "py-v*"]

permissions:
  contents: read

jobs:
  github-release:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          test "v$v" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME != package.json $v"; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          # Lines between "## [<version>]" and the next "## [" heading (plain string match, no regex escaping).
          awk -v h="## [$v]" 'index($0, h) == 1 {on = 1; next} on && index($0, "## [") == 1 {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::No '## [$v]' section in CHANGELOG.md"; exit 1; }
          cat >> notes.md <<EOF

          ### Run it
          \`\`\`bash
          docker pull ghcr.io/${GITHUB_REPOSITORY}:${v}
          \`\`\`
          See the [self-hosting guide](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/SELF_HOSTING.md).
          EOF
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "minicrawl $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  npm:
    if: startsWith(github.ref_name, 'mcp-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write   # trusted publishing + provenance
    defaults:
      run:
        working-directory: integrations/mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest   # trusted publishing needs npm 11.5.1+
      - name: Check tag matches package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          test "mcp-v$v" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME != package.json $v"; exit 1; }
      - run: npm publish --provenance --access public

  pypi:
    if: startsWith(github.ref_name, 'py-v')
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write   # trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check tag matches pyproject.toml
        working-directory: integrations/python
        run: |
          v="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "py-v$v" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME != pyproject.toml $v"; exit 1; }
      - name: Build
        working-directory: integrations/python
        run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: integrations/python/dist
