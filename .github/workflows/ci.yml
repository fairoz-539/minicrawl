name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    # Ubuntu 24.04 has glibc 2.39; light-ocr's Linux build needs 2.38+.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  postgres:
    name: Tests (Node 24, Postgres scale mode)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: minicrawl
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      STORAGE: postgres
      DATABASE_URL: postgres://postgres:ci@localhost:5432/minicrawl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The whole suite on Postgres, plus test/scale.test.js (separate API and
      # worker processes, killed-worker recovery), which only runs here.
      - run: npm test

  ollama:
    # Real local-model extraction. Not a required check: it downloads a ~1 GB model.
    name: Local AI (Ollama)
    runs-on: ubuntu-24.04
    services:
      ollama:
        image: ollama/ollama:latest
        ports: ["11434:11434"]
    env:
      OLLAMA_TEST_URL: http://localhost:11434
      OLLAMA_TEST_MODEL: qwen2.5:1.5b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pull the model
        run: curl -fsS http://localhost:11434/api/pull -d '{"model":"qwen2.5:1.5b","stream":false}'
      - run: node --disable-warning=ExperimentalWarning --test --test-timeout=600000 test/ollama.test.js

  helm:
    name: Helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/minicrawl --set apiKeys=ci-key-0123456789abcdef,databaseUrl=postgres://u:p@db/minicrawl
      - run: helm template ci deploy/helm/minicrawl --set apiKeys=ci-key-0123456789abcdef,databaseUrl=postgres://u:p@db/minicrawl,worker.autoscaling.enabled=true,ingress.enabled=true > /dev/null

  python:
    name: Python client + LangChain/LlamaIndex (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci   # the tests start a real minicrawl server
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "integrations/python[dev]"
      - run: pytest -q integrations/python
      # Contract tests: the official firecrawl-py SDK (v2 client) against minicrawl.
      # The JS SDK's contract tests (test/sdk.test.js) run with npm test.
      - run: pip install "firecrawl-py==4.54.0"
      - run: pytest -q test/contract-py -W ignore::DeprecationWarning

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: minicrawl:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Refuses to start without an API key
        run: |
          docker run --name nokey minicrawl:ci || true
          docker logs nokey 2>&1 | grep -q "No API key configured"
      - name: Starts healthy with browser and OCR
        run: |
          docker run -d --name app -p 3002:3002 --shm-size=1g -e API_KEY="$(openssl rand -hex 32)" minicrawl:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && break
            sleep 3
          done
          curl -fsS http://localhost:3002/health | tee health.json
          grep -q '"browser":true' health.json
          grep -q '"ocr":true' health.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3002/v1/scrape)" = 401
      - name: Logs on failure
        if: failure()
        run: docker logs app || true
