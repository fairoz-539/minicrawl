name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    # Ubuntu 24.04 has glibc 2.39; light-ocr's Linux build needs 2.38+.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: minicrawl:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Refuses to start without an API key
        run: |
          docker run --name nokey minicrawl:ci || true
          docker logs nokey 2>&1 | grep -q "No API key configured"
      - name: Starts healthy with browser and OCR
        run: |
          docker run -d --name app -p 3002:3002 --shm-size=1g -e API_KEY="$(openssl rand -hex 32)" minicrawl:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && break
            sleep 3
          done
          curl -fsS http://localhost:3002/health | tee health.json
          grep -q '"browser":true' health.json
          grep -q '"ocr":true' health.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3002/v1/scrape)" = 401
      - name: Logs on failure
        if: failure()
        run: docker logs app || true
